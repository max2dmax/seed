<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEED - AI Song Framework</title>
    <style>
        body {
            background: linear-gradient(135deg, #1b1b1b, #2b2b2b);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .pedal-container {
            background: #222;
            border: 4px solid #444;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.2);
            padding: 2em;
            width: 350px;
            text-align: center;
        }

        .pedal-button {
            background: hotpink;
            border: none;
            color: #fff;
            font-size: 1.2em;
            padding: 10px 20px;
            margin-top: 1em;
            border-radius: 10px;
            box-shadow: 0 4px #c2185b;
            cursor: pointer;
        }

        .pedal-button:hover {
            background: #ff69b4;
        }

        select, input[type="file"] {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 10px;
            border-radius: 8px;
            margin-top: 1em;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="pedal-container">
        <h1>SEED</h1>
        <label for="mode">Generation Mode:</label>
        <select name="mode" id="mode" onchange="toggleForm()">
          <option value="audio">Upload Audio</option>
          <option value="prompt">Generate from Prompt</option>
        </select>

        <div id="audio-form">
          <form method="post" action="/upload" enctype="multipart/form-data" id="upload-form">
            <input type="file" name="file" required>
            
            <label for="genre">Genre:</label>
            <select name="genre" id="genre">
              <option value="rock">Rock</option>
              <option value="pop">Pop</option>
              <option value="lofi">Lo-fi</option>
              <option value="electronic">Electronic</option>
            </select>
          
            <label for="structure">Structure:</label>
            <select name="structure" id="structure">
              <option value="verse-chorus">Verse-Chorus</option>
              <option value="aaba">AABA</option>
              <option value="through-composed">Through-Composed</option>
            </select>
          
            <input type="submit" class="pedal-button" value="Upload">
          </form>
        </div>

        <div id="prompt-form" style="display:none;">
          <form method="post" action="/generate" id="prompt-submit-form">
            <label for="text-prompt">Prompt:</label>
            <input type="text" name="prompt" id="text-prompt" required>
        
            <label for="genre-prompt">Genre:</label>
            <select name="genre" id="genre-prompt">
              <option value="rock">Rock</option>
              <option value="pop">Pop</option>
              <option value="lofi">Lo-fi</option>
              <option value="electronic">Electronic</option>
            </select>

            <label for="structure-prompt">Structure:</label>
            <select name="structure" id="structure-prompt">
              <option value="verse-chorus">Verse-Chorus</option>
              <option value="aaba">AABA</option>
              <option value="through-composed">Through-Composed</option>
            </select>

            <input type="submit" class="pedal-button" value="Generate">
          </form>
        </div>

        <div id="processing-indicator" style="margin-top: 1em; display: none;">
          <div style="width: 20px; height: 20px; background-color: red; border-radius: 50%; margin: 0 auto; box-shadow: 0 0 10px red;"></div>
          <p style="font-size: 0.9em; margin-top: 0.5em;">Processing...</p>
        </div>

        <div id="preview-container" style="margin-top: 2em; display: none;">
          <h3>Preview</h3>
          <audio id="audio-preview" controls style="width: 100%; margin-top: 1em;"></audio>
        </div>
    </div>
<script>
  const form = document.getElementById('upload-form');
  const processing = document.getElementById('processing-indicator');
  const previewContainer = document.getElementById('preview-container');
  const audioPreview = document.getElementById('audio-preview');

  form.addEventListener('submit', () => {
    processing.style.display = 'block';
    previewContainer.style.display = 'none';
  });

  // Toggle between forms
  function toggleForm() {
    const mode = document.getElementById('mode').value;
    document.getElementById('audio-form').style.display = mode === 'audio' ? 'block' : 'none';
    document.getElementById('prompt-form').style.display = mode === 'prompt' ? 'block' : 'none';
  }

  // Show loading indicator for prompt form
  const promptForm = document.getElementById('prompt-submit-form');
  if (promptForm) {
    promptForm.addEventListener('submit', () => {
      processing.style.display = 'block';
      previewContainer.style.display = 'none';
    });
  }

  // In a real implementation, you'd fetch this preview after server-side processing
  // This is just a placeholder for demo purposes
  function showPreview(audioUrl) {
    processing.style.display = 'none';
    audioPreview.src = audioUrl;
    previewContainer.style.display = 'block';
  }
</script>
</body>
</html>
