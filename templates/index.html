<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEED - AI Song Framework</title>
    <style>
        body {
            background: linear-gradient(135deg, #1b1b1b, #2b2b2b);
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .pedal-container {
            background: #222;
            border: 4px solid #444;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.2);
            padding: 2em;
            width: 350px;
            text-align: center;
        }

        .pedal-button {
            background: hotpink;
            border: none;
            color: #fff;
            font-size: 1.2em;
            padding: 10px 20px;
            margin-top: 1em;
            border-radius: 10px;
            box-shadow: 0 4px #c2185b;
            cursor: pointer;
        }

        .pedal-button:hover {
            background: #ff69b4;
        }

        select, input[type="file"] {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 10px;
            border-radius: 8px;
            margin-top: 1em;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="pedal-container">
        <h1>🎸 SEED</h1>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required><br>

            <label for="genre">Choose a genre:</label><br>
            <select name="genre" id="genre">
                <option value="pop">Pop</option>
                <option value="rock">Rock</option>
                <option value="lofi">Lo-Fi</option>
                <option value="country">Country</option>
                <option value="hiphop">Hip Hop</option>
            </select><br>

            <label for="structure">Song structure:</label><br>
            <select name="structure" id="structure">
                <option value="verse-chorus-bridge">Verse / Chorus / Bridge</option>
                <option value="chorus-only">Chorus Only</option>
                <option value="build">Build-Up Drop Outro</option>
            </select><br>

            <input class="pedal-button" type="submit" value="Upload & Generate">
        </form>
    </div>
</body>
</html>
